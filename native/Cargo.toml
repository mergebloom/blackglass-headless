[package]
name = "blackglass-headless-native"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "bgh"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
aes-siv = "0.7"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"
url = "2"
futures-util = "0.3"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
